name: Docs 최신화 확인

# 변경분 때문에 낡은 문서가 생겼는지 Claude 가 확인한다.
#
# 규칙 스크립트를 두지 않는 이유: product 목록·심볼 이름을 하드코딩한 검사기는
# 그 자체가 최신화 대상이 된다(새 모듈이 생길 때마다 규칙을 고쳐야 함).
# 문서와 코드의 대조는 판단이 필요한 일이라 Claude 에게 맡긴다.

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  docs:
    name: 문서-코드 대조
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # 이걸 주지 않으면 Claude GitHub App 설치를 요구한다(401).
          # 워크플로우 기본 토큰으로 충분하다 — 위 permissions 로 권한을 준다.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # 푸시할 때마다 코멘트가 쌓이지 않게 하나를 갱신한다.
          use_sticky_comment: "true"
          prompt: |
            이 PR 의 변경분 때문에 **낡아진 문서**가 있는지만 확인해라.
            코드 품질 리뷰는 다른 워크플로우가 하니 여기선 하지 마라.

            대조 대상:
            - `docs/auth/*.md` (00~08)
            - `README.md`, `CHANGELOG.md`
            - 루트 및 각 모듈 최상단 `CLAUDE.md`
            - `Examples/AuthSample/README.md`
            - `.claude/skills/auth-setup/SKILL.md`

            확인할 것:
            1. **product 목록**: 문서가 product 로 소개하는 이름이 Package.swift 의
               `.library(name:)` 에 실재하는가. (예전에 `AuthKitREST` 를 AuthKit
               타깃으로 흡수했는데 문서엔 별도 product 로 남아 있던 전례가 있다)
            2. **공개 API 이름**: 문서 코드블록에 나오는 타입·메서드·프로퍼티가
               현재 소스에 실재하는가. 이름이 바뀐 API 가 문서에 남아 있는가.
            3. **조립 예시**: `DefaultAuthService(...)` 등의 초기화 예시가 현재
               시그니처와 맞는가.
            4. **상대 링크**: 마크다운 링크가 실제 존재하는 파일을 가리키는가.
            5. **CHANGELOG**: 공개 API 가 바뀌었는데 항목이 없는가.
               (단, 과거 릴리스 항목은 그때의 기록이므로 고치라고 하지 마라)

            지침:
            - **실제로 어긋난 것만** 지적해라. 파일 경로와 줄을 명시하고,
              어떻게 고쳐야 하는지 한 줄로 제안해라.
            - 문서를 새로 쓰라고 요구하지 마라. 변경분과 어긋난 부분만 본다.
            - 이번 변경이 문서에 영향이 없으면 "문서 갱신 불필요"라고만 해라.
            - 한국어로 작성해라.

            결과는 `gh pr comment` 로 PR 에 한 번에 남겨라.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git diff:*)"
